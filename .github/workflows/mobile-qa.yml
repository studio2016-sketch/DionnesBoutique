name: Mobile storefront QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local website
        run: |
          npm run start -- -p 3000 > /tmp/dionnes-next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/dionnes-next.log
          exit 1
      - name: Verify mobile and desktop experience
        run: node scripts/check-responsive.mjs
      - name: Audit all product photographs in browser
        run: node scripts/audit-catalog-images.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-responsive-screenshots
          path: artifacts/
          if-no-files-found: ignore
